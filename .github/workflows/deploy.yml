name: Deploy to Windows Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-windows-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Deploy to Windows Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script_stop: true
        command_timeout: 30m
        script: |
          @echo off
          setlocal enabledelayedexpansion
          echo 开始部署...
          
          REM 进入项目目录
          set PROJECT_DIR=${{ secrets.PROJECT_DIR }}
          if "!PROJECT_DIR!"=="" set PROJECT_DIR=C:\apps\miniapp-express-api
          if not exist "!PROJECT_DIR!" (
            echo 项目目录不存在: !PROJECT_DIR!
            exit /b 1
          )
          cd /d "!PROJECT_DIR!" || exit /b 1
          
          REM 拉取最新代码
          echo 拉取最新代码...
          git pull --ff-only origin main || exit /b 1
          
          REM 安装依赖
          echo 安装依赖...
          call npm ci || exit /b 1
          
          REM 生成 Prisma Client
          echo 生成 Prisma Client...
          call npx prisma generate || exit /b 1
          
          REM 执行数据库迁移
          echo 执行数据库迁移...
          call npx prisma migrate deploy || exit /b 1
          
          REM 构建项目
          echo 构建项目...
          call npm run build || exit /b 1
          
          REM 使用 PM2 重启应用
          echo 重启应用...
          call pm2 describe miniapp-api >nul 2>&1
          if !errorlevel! equ 0 (
            call pm2 reload miniapp-api --update-env
          ) else (
            call pm2 start dist\server.js --name miniapp-api
          )
          if !errorlevel! neq 0 exit /b 1
          
          REM 保存 PM2 配置
          call pm2 save || exit /b 1
          
          echo 部署完成！