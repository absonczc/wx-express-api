name: Deploy to Windows Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-windows-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Deploy to Windows Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script_stop: true
        command_timeout: 30m
        # 必须用块标量：未加引号的行内标量里若出现「冒号+空格」会破坏 YAML；且 SSH 默认 shell 常为 cmd，需 powershell.exe -Command 单行脚本块。
        script: |-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& { $ErrorActionPreference='Stop'; Write-Host '开始部署...'; $projectDir='${{ secrets.PROJECT_DIR }}'; if ([string]::IsNullOrWhiteSpace($projectDir)) { $projectDir='C:\apps\miniapp-express-api' }; if (-not (Test-Path -LiteralPath $projectDir)) { Write-Host ('项目目录不存在: ' + $projectDir); exit 1 }; Set-Location -LiteralPath $projectDir; if (-not (Test-Path -LiteralPath '.\package.json')) { Write-Host '当前目录缺少 package.json，请在 GitHub Secrets 设置 PROJECT_DIR'; exit 1 }; Write-Host '拉取最新代码...'; git pull --ff-only origin main; if (-not $?) { exit 1 }; Write-Host '停止应用以释放 Prisma 等文件锁'; pm2 stop miniapp-api *> $null; Start-Sleep -Seconds 2; Write-Host '安装依赖...'; npm ci; if (-not $?) { exit 1 }; Write-Host '生成 Prisma Client...'; npx prisma generate; if (-not $?) { exit 1 }; Write-Host '执行数据库迁移...'; npx prisma migrate deploy; if (-not $?) { exit 1 }; Write-Host '构建项目...'; npm run build; if (-not $?) { exit 1 }; Write-Host '启动应用...'; pm2 describe miniapp-api *> $null; $pm2Exists = ($LASTEXITCODE -eq 0); if ($pm2Exists) { pm2 start miniapp-api } else { pm2 start dist\server.js --name miniapp-api }; if (-not $?) { exit 1 }; pm2 save; if (-not $?) { exit 1 }; Write-Host '部署完成！' }"