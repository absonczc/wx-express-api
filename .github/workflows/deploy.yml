name: Deploy to Windows Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Deploy to Windows Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script: |
          @echo off
          echo 开始部署...
          
          REM 设置项目目录（从环境变量读取，默认为 Administrator 用户目录）
          set "PROJECT_DIR=${{ secrets.PROJECT_DIR || 'C:\Users\Administrator\miniapp-express-api' }}"
          echo 项目目录: %PROJECT_DIR%
          
          REM 检查目录是否存在，如果不存在则创建
          if not exist "%PROJECT_DIR%" (
            echo 创建项目目录...
            mkdir "%PROJECT_DIR%"
          )
          
          REM 进入项目目录
          cd /d "%PROJECT_DIR%" || exit /b 1
          
          REM 检查是否为 git 仓库，如果不是则克隆
          if not exist ".git" (
            echo 初始化 git 仓库...
            git clone https://github.com/${{ github.repository }}.git temp_repo
            xcopy temp_repo\* . /E /I /Y
            rmdir /S /Q temp_repo
          )
          
          REM 拉取最新代码
          echo 拉取最新代码...
          git fetch origin
          git reset --hard origin/main
          
          REM 安装依赖
          echo 安装依赖...
          call npm ci --production
          
          REM 生成 Prisma Client
          echo 生成 Prisma Client...
          call npx prisma generate
          
          REM 执行数据库迁移
          echo 执行数据库迁移...
          call npx prisma migrate deploy
          
          REM 构建项目
          echo 构建项目...
          call npm run build
          
          REM 使用 PM2 重启应用
          echo 重启应用...
          pm2 list | findstr "miniapp-api" >nul
          if %errorlevel% equ 0 (
            call pm2 reload miniapp-api --update-env
          ) else (
            call pm2 start dist\server.js --name miniapp-api
          )
          
          REM 保存 PM2 配置
          call pm2 save
          
          echo 部署完成！